<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sexting Plans</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111214;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button {
    font: inherit;
}

.app {
    max-width: 700px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 80px;
}

/* HEADER */

.header {
    padding: 22px 20px 16px;
    border-bottom: 1px solid #292b30;
    position: sticky;
    top: 0;
    background: rgba(17,18,20,.96);
    backdrop-filter: blur(12px);
    z-index: 10;
}

.logo {
    font-size: 13px;
    font-weight: 700;
    color: #ff513d;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.title {
    font-size: 28px;
    font-weight: 800;
    margin-top: 7px;
}

.subtitle {
    color: #8d9098;
    margin-top: 5px;
    font-size: 14px;
}

/* CONTENT */

.content {
    padding: 20px;
}

.section-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 14px;
}

/* PLAN CARDS */

.plan {
    background: #1b1d21;
    border: 1px solid #303238;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: .2s;
}

.plan:hover {
    border-color: #555861;
    transform: translateY(-1px);
}

.plan-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.plan-name {
    font-size: 18px;
    font-weight: 750;
}

.plan-arrow {
    color: #777b84;
    font-size: 22px;
}

.plan-info {
    margin-top: 8px;
    color: #92959d;
    font-size: 14px;
    line-height: 1.45;
}

.badge {
    display: inline-block;
    margin-top: 12px;
    padding: 5px 9px;
    border-radius: 8px;
    background: #272a30;
    color: #b7bac1;
    font-size: 11px;
    font-weight: 700;
}

/* PLAN PAGE */

.back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: none;
    color: #aeb1b8;
    padding: 0;
    margin-bottom: 20px;
    cursor: pointer;
}

.plan-page-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.plan-meta {
    color: #777b84;
    font-size: 13px;
    margin-bottom: 24px;
}

.text-block {
    background: #1b1d21;
    border: 1px solid #303238;
    border-radius: 16px;
    padding: 20px;
    line-height: 1.65;
    color: #dedfe3;
}

.text-block h3 {
    margin-top: 0;
    color: #fff;
}

.text-block p {
    margin: 14px 0;
}

.text-block ul {
    padding-left: 20px;
}

.text-block li {
    margin: 9px 0;
}

/* REFERENCES */

.references {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.reference {
    background: #1b1d21;
    border: 1px solid #303238;
    border-radius: 14px;
    overflow: hidden;
}

.reference-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background:
        linear-gradient(135deg, #292b31, #17181b);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777b84;
    font-size: 13px;
}

.reference-info {
    padding: 12px;
}

.reference-title {
    font-weight: 700;
    font-size: 14px;
}

.reference-desc {
    color: #858891;
    font-size: 12px;
    margin-top: 4px;
}

/* NAVIGATION */

.nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, 100%);
    height: 68px;
    background: rgba(25,26,29,.97);
    border-top: 1px solid #303238;
    display: flex;
    z-index: 20;
}

.nav button {
    flex: 1;
    border: none;
    background: transparent;
    color: #777b84;
    cursor: pointer;
    font-size: 12px;
    font-weight: 650;
}

.nav button.active {
    color: #ff513d;
}

.nav-icon {
    display: block;
    font-size: 21px;
    margin-bottom: 3px;
}

/* MOBILE */

@media (max-width: 480px) {

    .title {
        font-size: 25px;
    }

    .content {
        padding: 16px;
    }

    .references {
        grid-template-columns: 1fr 1fr;
    }

    .plan-page-title {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">
        <div class="logo">CONTENT MANAGER</div>
        <div class="title">Sexting Plans</div>
        <div class="subtitle">Готовые планы и референсы для работы</div>
    </header>


    <!-- MAIN -->

    <main class="content" id="app"></main>


    <!-- NAVIGATION -->

    <nav class="nav">

        <button id="navPlans" class="active" onclick="showPlans()">
            <span class="nav-icon">☰</span>
            Планы
        </button>

        <button id="navRefs" onclick="showReferences()">
            <span class="nav-icon">▣</span>
            Референсы
        </button>

    </nav>

</div>


<script>

const plans = [

    {
        id: 1,
        name: "Sexting #01",
        description: "Базовый сценарий. Постепенное развитие диалога.",
        tag: "BASIC",

        content: `
            <h3>SEXTING #01</h3>

            <p>
                Начинаем спокойно и постепенно переводим разговор
                в более личное настроение.
            </p>

            <p><strong>1. Начало</strong></p>

            <p>
                Начать с обычного общения и реакции на его сообщения.
                Не торопимся сразу переходить к основной части.
            </p>

            <p><strong>2. Разогрев</strong></p>

            <ul>
                <li>Поддерживать диалог.</li>
                <li>Задавать вопросы.</li>
                <li>Использовать его ответы для следующего сообщения.</li>
                <li>Постепенно усиливать флирт.</li>
            </ul>

            <p><strong>3. Основная часть</strong></p>

            <p>
                После того как собеседник активно включился,
                переходим к основной части сценария.
            </p>

            <p><strong>4. PPV</strong></p>

            <p>
                В нужный момент отправляем платный контент
                согласно сценарию.
            </p>

            <p><strong>5. Завершение</strong></p>

            <p>
                Не обрываем разговор сразу после PPV.
                Оставляем повод продолжить общение.
            </p>
        `
    },

    {
        id: 2,
        name: "Sexting #02",
        description: "Более игривый сценарий с акцентом на teasing.",
        tag: "TEASING",

        content: `
            <h3>SEXTING #02</h3>

            <p>
                Этот сценарий строится вокруг teasing —
                постепенно создаём интерес и ожидание.
            </p>

            <p><strong>1. Старт</strong></p>

            <p>
                Начать с лёгкого флирта и коротких сообщений.
            </p>

            <p><strong>2. Teasing</strong></p>

            <ul>
                <li>Не раскрывать всё сразу.</li>
                <li>Оставлять интригу.</li>
                <li>Реагировать на его настроение.</li>
            </ul>

            <p><strong>3. Контент</strong></p>

            <p>
                Постепенно увеличивать ценность контента
                и переходить к следующему этапу.
            </p>

            <p><strong>4. PPV</strong></p>

            <p>
                Отправить соответствующий платный контент
                в момент максимального интереса.
            </p>
        `
    },

    {
        id: 3,
        name: "Sexting #03",
        description: "Сценарий для более активного собеседника.",
        tag: "ACTIVE",

        content: `
            <h3>SEXTING #03</h3>

            <p>
                Используем, когда фанат уже активно отвечает
                и сам поддерживает разговор.
            </p>

            <p><strong>Главная задача</strong></p>

            <p>
                Не перегружать его длинными сообщениями,
                а быстро реагировать и поддерживать темп.
            </p>

            <p><strong>Структура</strong></p>

            <ul>
                <li>Ответ.</li>
                <li>Реакция на его сообщение.</li>
                <li>Новый вопрос или teasing.</li>
                <li>Контент.</li>
                <li>Следующий шаг сценария.</li>
            </ul>
        `
    }

];


function showPlans() {

    setActive("navPlans");

    let html = `
        <div class="section-title">
            Sexting планы
        </div>
    `;

    plans.forEach(plan => {

        html += `
            <div class="plan" onclick="openPlan(${plan.id})">

                <div class="plan-top">

                    <div class="plan-name">
                        ${plan.name}
                    </div>

                    <div class="plan-arrow">
                        ›
                    </div>

                </div>

                <div class="plan-info">
                    ${plan.description}
                </div>

                <span class="badge">
                    ${plan.tag}
                </span>

            </div>
        `;

    });

    document.getElementById("app").innerHTML = html;
}


function openPlan(id) {

    const plan = plans.find(p => p.id === id);

    document.getElementById("app").innerHTML = `

        <button class="back" onclick="showPlans()">
            ← Назад
        </button>

        <div class="plan-page-title">
            ${plan.name}
        </div>

        <div class="plan-meta">
            ${plan.tag} · готовый сценарий
        </div>

        <div class="text-block">
            ${plan.content}
        </div>

    `;
}


function showReferences() {

    setActive("navRefs");

    document.getElementById("app").innerHTML = `

        <div class="section-title">
            Референсы
        </div>

        <p style="color:#858891; margin-top:-5px; margin-bottom:20px;">
            Примеры контента и ориентиры для работы.
        </p>

        <div class="references">

            <div class="reference">

                <div class="reference-image">
                    REFERENCE 01
                </div>

                <div class="reference-info">

                    <div class="reference-title">
                        Teasing
                    </div>

                    <div class="reference-desc">
                        Пример подачи
                    </div>

                </div>

            </div>


            <div class="reference">

                <div class="reference-image">
                    REFERENCE 02
                </div>

                <div class="reference-info">

                    <div class="reference-title">
                        PPV
                    </div>

                    <div class="reference-desc">
                        Пример контента
                    </div>

                </div>

            </div>


            <div class="reference">

                <div class="reference-image">
                    REFERENCE 03
                </div>

                <div class="reference-info">

                    <div class="reference-title">
                        Pose
                    </div>

                    <div class="reference-desc">
                        Пример позы
                    </div>

                </div>

            </div>


            <div class="reference">

                <div class="reference-image">
                    REFERENCE 04
                </div>

                <div class="reference-info">

                    <div class="reference-title">
                        Outfit
                    </div>

                    <div class="reference-desc">
                        Пример образа
                    </div>

                </div>

            </div>

        </div>

    `;
}


function setActive(id) {

    document.querySelectorAll(".nav button")
        .forEach(button => button.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");
}


showPlans();

</script>

</body>
</html>
